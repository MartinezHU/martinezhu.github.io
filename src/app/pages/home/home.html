<!-- Hero Section -->
<app-hero></app-hero>

<!-- Sección Sobre Mí -->
<section class="section about-preview" id="about-me">
  <div class="container">
    <div class="columns is-vcentered">
      <div class="column is-5 has-text-centered">
        <figure class="image is-256x256 is-inline-block">
          <img
            class="is-rounded profile-image"
            src="https://via.placeholder.com/256"
            alt="Foto de perfil"
          />
        </figure>
      </div>
      <div class="column is-7">
        <h2 class="title is-2 has-text-weight-bold mb-4">
          {{ 'home.aboutTitlePrefix' | translate }}
          <span class="has-text-primary">{{ 'home.aboutTitleHighlight' | translate }}</span>
        </h2>
        <p class="content is-size-5 has-text-grey-dark mb-5">
          {{ 'home.aboutText1' | translate }}
        </p>
        <p class="content is-size-6 has-text-grey mb-5">
          {{ 'home.aboutText2' | translate }}
        </p>
        <a routerLink="/about-me-details" class="button is-primary is-medium">
          <span class="icon">
            <i class="fas fa-user-circle"></i>
          </span>
          <span>{{ 'home.aboutCta' | translate }}</span>
        </a>
      </div>
    </div>
  </div>
</section>
